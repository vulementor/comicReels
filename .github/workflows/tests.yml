name: Phase 3-B frontend validation

on:
  pull_request:

concurrency:
  group: phase3b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Verify toolchain and lockfile
        run: |
          node --version
          npm --version
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(l.lockfileVersion!==3) throw new Error('expected lockfileVersion 3'); if(JSON.stringify(p.dependencies)!==JSON.stringify(l.packages[''].dependencies)) throw new Error('dependency lock mismatch'); if(JSON.stringify(p.devDependencies)!==JSON.stringify(l.packages[''].devDependencies)) throw new Error('devDependency lock mismatch'); console.log('package/lockfile contract: OK')"

      - name: Install exact frontend dependencies
        run: npm ci

      - name: TypeScript
        run: npx --no-install tsc -b --pretty false

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
