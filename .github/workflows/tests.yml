name: thoremix stageonly Windows contracts

on:
  push:
    branches:
      - validation/stageonly-ce7f06c

concurrency:
  group: thoremix-stageonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Parse build script
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'deployment/thoremix/Build-Stable.ps1').Path,
            [ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){
            foreach($e in $errors){
              Write-Host ("PARSE|line={0}|col={1}|extent={2}|id={3}|msg={4}" -f $e.Extent.StartLineNumber,$e.Extent.StartColumnNumber,$e.Extent.Text,$e.ErrorId,$e.Message)
            }
            exit 1
          }
      - name: StageOnly and dependency contracts
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deployment/thoremix/Test-StageOnlyContract.ps1
      - name: KAT staging contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deployment/thoremix/Test-KatStagingContract.ps1
      - name: Existing move diagnostics contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deployment/thoremix/Test-UpgradeMoveDiagnostics.ps1
