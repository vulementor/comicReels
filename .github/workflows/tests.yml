name: flow login lifecycle focused validation

on:
  push:
    branches:
      - validation/flow-stale-lease-c38d2f

concurrency:
  group: flow-login-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile focused lifecycle modules
        run: >
          python -m py_compile
          agent/services/flow_browser_session.py
          agent/services/flow_browser_login.py
          agent/thoremix/cli.py
          tests/unit/test_flow_browser_session.py
          tests/unit/test_flow_browser_login.py

      - name: Run focused lifecycle contracts
        env:
          PYTHONUNBUFFERED: "1"
        run: >
          python -m pytest -q
          tests/unit/test_flow_browser_login.py
          tests/unit/test_flow_browser_session.py::test_default_acquire_never_reclaims_confirmed_stale_provider_marker
          tests/unit/test_flow_browser_session.py::test_explicit_reconcile_rejects_active_owner_and_preserves_marker
          tests/unit/test_flow_browser_session.py::test_explicit_reconcile_rejects_pid_reuse_even_with_same_pid
          tests/unit/test_flow_browser_session.py::test_explicit_reconcile_rejects_unknown_owner
          tests/unit/test_flow_browser_session.py::test_explicit_reconcile_rejects_invalid_marker_without_rewriting
          tests/unit/test_flow_browser_session.py::test_explicit_reconcile_rejects_foreign_host
          tests/unit/test_flow_browser_session.py::test_explicit_reconcile_rejects_native_profile_busy_after_dead_owner
          tests/unit/test_flow_browser_session.py::test_explicit_reconcile_archives_confirmed_stale_marker_and_acquires
          tests/unit/test_flow_browser_session.py::test_legacy_marker_is_dead_only_and_never_invents_creation_identity
          tests/unit/test_flow_browser_session.py::test_explicit_reconcile_detects_marker_race_and_does_not_acquire
          tests/unit/test_flow_browser_session.py::test_new_marker_records_current_process_creation_identity
          tests/unit/test_flow_browser_session.py::test_windows_process_observation_uses_creation_identity_for_real_pid
          tests/unit/test_flow_browser_session.py::test_windows_native_profile_probe_detects_delete_denial
