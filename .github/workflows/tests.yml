name: thoremix input disjoint Windows contracts

on:
  push:
    branches:
      - validation/input-disjoint-4196560

concurrency:
  group: thoremix-input-disjoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse PowerShell contracts
        shell: powershell
        run: |
          foreach($path in @(
            'deployment/thoremix/Build-Stable.ps1',
            'deployment/thoremix/Child-PythonIsolation.ps1',
            'deployment/thoremix/Test-StageOnlyContract.ps1',
            'deployment/thoremix/Test-StageInputIsolation.ps1',
            'deployment/thoremix/Test-ChildPythonIsolation.ps1',
            'deployment/thoremix/Test-KatStagingContract.ps1',
            'deployment/thoremix/Test-UpgradeMoveDiagnostics.ps1'
          )){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){
              foreach($e in $errors){
                Write-Host ("PARSE|file={0}|line={1}|col={2}|extent={3}|id={4}|msg={5}" -f $path,$e.Extent.StartLineNumber,$e.Extent.StartColumnNumber,$e.Extent.Text,$e.ErrorId,$e.Message)
              }
              exit 1
            }
          }

      - name: Stage input physical disjointness
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deployment/thoremix/Test-StageInputIsolation.ps1

      - name: StageOnly and dependency contracts
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deployment/thoremix/Test-StageOnlyContract.ps1

      - name: Child Python and pip isolation execution
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deployment/thoremix/Test-ChildPythonIsolation.ps1

      - name: KAT staging contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deployment/thoremix/Test-KatStagingContract.ps1

      - name: Existing move diagnostics contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deployment/thoremix/Test-UpgradeMoveDiagnostics.ps1
