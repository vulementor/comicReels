# Nothing ran the tests on push or PR before this, so a broken main was only
# ever caught by hand. PR #48 reached `main` carrying an ImportError against a
# module a merged PR had deleted; this job is what catches that class of thing.
name: portable tests

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    # The suite takes ~7s. A ceiling this generous only ever trips on a hang,
    # which this suite has had before: an aiosqlite connection left open keeps a
    # non-daemon worker thread alive and the interpreter never exits.
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The floor the README advertises, and the version development runs on.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Ensure ffmpeg without blocking an already-provisioned hosted runner
        # Validation-only setup: keep application/runtime semantics untouched.
        # This is the bounded hosted pattern previously used by the full portable gate.
        run: |
          if ffmpeg -hide_banner -version >/dev/null 2>&1; then
            echo "hosted ffmpeg available"
          else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg fonts-dejavu-core
          fi

      - name: Report whether drawtext renders
        # This used to fail the build, because naming an absent filter aborted
        # the whole chain and took 13 tests down with it. video_reviewer.py now
        # probes for drawtext and drops it when it is missing, so its absence
        # is a supported degradation (sheets lose their burned-in timestamps)
        # rather than a build breaker — and the fallback has its own coverage.
        #
        # The check stays because the timestamped path is the better one and a
        # silent loss of it is worth seeing in the log. Checking
        # `ffmpeg -filters` would only prove the filter is compiled in, not
        # that a font exists, so render a real frame through the filter the
        # code uses.
        run: |
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "testsrc=duration=1:size=320x240:rate=5" \
            -vf "drawtext=text='%{pts\:hms}':x=5:y=5:fontsize=14:fontcolor=white:borderw=1:bordercolor=black" \
            -frames:v 1 -y /tmp/drawtext-smoke.jpg \
            && echo "drawtext renders — contact sheets will carry timestamps" \
            || {
              echo "::warning::ffmpeg cannot render drawtext (no --enable-libfreetype, or no font). Sheets will be untimestamped; the suite still covers that path."
              ffmpeg -hide_banner -version | head -3
            }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run portable unit tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # Hosted GITHUB_TOKEN cannot read the private sibling toolkits and
          # Ubuntu cannot exercise the Windows GUI/bundled-media contracts.
          # The owner retired self-hosted validation on 2026-10-01.
          # Excluded cases remain required for separate local final acceptance;
          # a portable PASS alone must never authorize Stable promotion.
          python -m pytest tests/unit -q \
            --ignore=tests/unit/test_flow_browser_discovery.py \
            --ignore=tests/unit/test_flow_browser_session.py \
            --ignore=tests/unit/test_thoremix_affiliate.py \
            --ignore=tests/unit/test_thoremix_catalog.py \
            --ignore=tests/unit/test_thoremix_publishing.py \
            --ignore=tests/unit/test_thoremix_social_cleanup.py \
            --ignore=tests/unit/test_thoremix_review_window.py \
            --deselect=tests/unit/test_thoremix_retry.py::test_failed_row_exposes_reason_and_retry_button \
            --deselect=tests/unit/test_thoremix_core.py::test_direct_sdk_uses_real_bundled_media_tools_without_ambient_path \
            --deselect=tests/unit/test_thoremix_finishing.py::test_render_masks_preserve_dimensions_duration_and_add_laugh_only_at_end
