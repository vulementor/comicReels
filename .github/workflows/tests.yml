name: project hydration focused validation

on:
  push:
    branches:
      - validation/project-hydration-f2a98ca

concurrency:
  group: project-hydration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile project navigation modules
        run: >
          python -m py_compile
          agent/services/flow_browser_driver.py
          tests/unit/test_flow_browser_driver_project_reads.py
          tests/unit/test_flow_browser_driver_project_read.py
          tests/unit/test_flow_browser_driver_lifecycle.py

      - name: Run focused driver and read lifecycle
        env:
          PYTHONUNBUFFERED: "1"
        run: >
          python -m pytest -q
          tests/unit/test_flow_browser_driver_project_reads.py
          tests/unit/test_flow_browser_driver_project_read.py
          tests/unit/test_flow_browser_driver_lifecycle.py
          tests/unit/test_flow_browser_backend_non_paid_parity.py
          tests/unit/test_flow_client_batch.py
