name: full portable py310 project hydration validation

on:
  push:
    branches:
      - validation/full-portable-py310-f2a98ca

concurrency:
  group: full-portable-py310-project-hydration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg with bounded apt retries
        run: |
          timeout 180s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 180s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -version | head -3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile changed Flow driver and tests
        run: >
          python -m py_compile
          agent/services/flow_browser_driver.py
          tests/unit/test_flow_browser_driver_project_reads.py

      - name: Run full portable suite
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pytest tests/unit -q \
            --ignore=tests/unit/test_flow_browser_discovery.py \
            --ignore=tests/unit/test_flow_browser_session.py \
            --ignore=tests/unit/test_thoremix_affiliate.py \
            --ignore=tests/unit/test_thoremix_catalog.py \
            --ignore=tests/unit/test_thoremix_publishing.py \
            --ignore=tests/unit/test_thoremix_social_cleanup.py \
            --ignore=tests/unit/test_thoremix_review_window.py \
            --deselect=tests/unit/test_thoremix_retry.py::test_failed_row_exposes_reason_and_retry_button \
            --deselect=tests/unit/test_thoremix_core.py::test_direct_sdk_uses_real_bundled_media_tools_without_ambient_path \
            --deselect=tests/unit/test_thoremix_finishing.py::test_render_masks_preserve_dimensions_duration_and_add_laugh_only_at_end
