name: ThoRemix full Windows validation

on:
  pull_request:
    paths:
      - "agent/thoremix/**"
      - "agent/comicreels/**"
      - "agent/services/**"
      - "deployment/thoremix/**"
      - "tests/unit/test_thoremix_*.py"
      - "requirements*.txt"
      - ".github/workflows/thoremix-full-windows.yml"
  workflow_dispatch:

concurrency:
  group: thoremix-full-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-unit:
    runs-on: [self-hosted, Windows, X64, github_reel_review]
    timeout-minutes: 25

    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve private sibling toolkit workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $configured = '${{ vars.KABIN_TOOLKIT_ROOT }}'
          if ([string]::IsNullOrWhiteSpace($configured)) {
            $root = 'C:\Users\vulem\OneDrive\Documents\ChatGPT\Kabin Toolkit Test'
          } else {
            $root = $configured
          }
          foreach ($name in @('kabin_affiliate_toolkit','kabin_reel_poster','kabin_browser_semantic')) {
            $path = Join-Path $root $name
            if (-not (Test-Path (Join-Path $path '.git'))) {
              throw "Required private sibling checkout is unavailable: $path"
            }
          }
          "KABIN_TOOLKIT_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create isolated validation environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP "comicreels-thoremix-${{ github.run_id }}"
          if (Test-Path $venv) { Remove-Item -LiteralPath $venv -Recurse -Force }
          python -m venv $venv
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --upgrade pip
          & $python -m pip install -r requirements.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'ComicReels test dependencies failed.' }
          & $python -m pip install -e (Join-Path $env:KABIN_TOOLKIT_ROOT 'kabin_affiliate_toolkit') -e (Join-Path $env:KABIN_TOOLKIT_ROOT 'kabin_reel_poster') -e (Join-Path $env:KABIN_TOOLKIT_ROOT 'kabin_browser_semantic')
          if ($LASTEXITCODE -ne 0) { throw 'Private sibling toolkit installation failed.' }
          "THOREMIX_TEST_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Report imported sibling identities
        shell: powershell
        run: |
          & $env:THOREMIX_TEST_PYTHON -c "import kabin_affiliate_toolkit,kabin_reel_poster,kabin_browser_semantic,numpy; print('KAT='+kabin_affiliate_toolkit.__file__); print('KRP='+kabin_reel_poster.__file__); print('KBS='+kabin_browser_semantic.__file__); print('numpy='+numpy.__version__)"

      - name: Run complete unit suite
        shell: powershell
        env:
          PYTHONUNBUFFERED: "1"
          PATH: C:\ffmpeg\bin;${{ env.PATH }}
        run: |
          & $env:THOREMIX_TEST_PYTHON -m pytest tests/unit -q
          if ($LASTEXITCODE -ne 0) { throw 'Full ComicReels unit suite failed.' }

      - name: Compile source
        shell: powershell
        run: |
          & $env:THOREMIX_TEST_PYTHON -m compileall -q agent
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed.' }
