[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "comicreels"
version = "1.3.1"
description = "Reusable ComicReels toolkit for comic and general Google Flow video, plus the ThoRemix application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.104", "uvicorn>=0.24", "aiosqlite>=0.19",
  "websockets>=12", "pydantic>=2.5", "aiohttp>=3.9",
  "httpx>=0.25", "anthropic>=0.40", "Pillow>=10",
  "python-multipart>=0.0.9", "tzdata>=2026.4",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

